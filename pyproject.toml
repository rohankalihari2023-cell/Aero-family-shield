[build-system]
requires = ["setuptools>=65.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aero-family-shield"
version = "1.2.0"
description = "GenAI-powered clinical & environmental assistant for navigating severe winter smog and urban air pollution."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Rohan Kalihari", email = "rohankalihari08@gmail.com" }
]
keywords = [
    "air-quality",
    "winter-smog",
    "temperature-inversion",
    "genai",
    "corsi-rosenthal",
    "cadr",
    "pm25",
    "health"
]
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "pydantic>=2.0.0",
    "python-multipart>=0.0.6"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "black>=23.0.0"
]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312", "py314"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
